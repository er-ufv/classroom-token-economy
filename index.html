<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Economía de fichas para la participación en clase: registro con un toque, ruleta, elige un amigo, títulos y exportación a Excel.">
<title>Fichas de participación</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
html,body{margin:0} img{max-width:100%} [hidden]{display:none!important} :root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
/* Layout: home = night hero + subject cards + dragon ladder; subject = sticky bar, mode switch, class meter, mode stage; config/prof = stacked panels. */
:root{
  --bg:#F2F3F7; --surface:#FFFFFF; --surface-2:#F5F6FA; --ink:#141A2E; --muted:#596179; --line:#DADDE6;
  --night:#0E1430; --night-2:#1A2250; --on-night:#F4F1E8; --on-night-muted:#B6BEDA;
  --gold:#E3A62F; --gold-deep:#A86E0C; --gold-soft:#FBEBC8;
  --brand:#3A47B8; --brand-ink:#FFFFFF;
  --ok:#1E8757; --danger:#B3263A;
  --lv1:#B7793A; --lv2:#8E6CC9; --lv3:#D27A22; --lv4:#4565C8; --lv5:#C9950F;
  --shadow:0 1px 2px rgba(20,26,46,.06),0 6px 18px rgba(20,26,46,.07);
  --f-display:"Bricolage Grotesque",ui-rounded,"Segoe UI",system-ui,sans-serif;
  --f-body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:16px;
}
:root[data-inst="ufv"]{--brand:#1F56D6}
:root[data-inst="esic"]{--brand:#C9640A}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0D1124; --surface:#161C36; --surface-2:#1C2342; --ink:#E9ECF6; --muted:#9CA5C2; --line:#2B3459;
    --night:#080B1C; --night-2:#141A3C; --gold-soft:#3A2E14; --gold-deep:#F2C564;
    --brand:#8C97FF; --brand-ink:#0D1124; --ok:#4CC28C; --danger:#F06A7C;
    --lv1:#E0A465; --lv2:#B8A0F0; --lv3:#F2A45A; --lv4:#86A2F5; --lv5:#F0C24A;
    --shadow:0 1px 2px rgba(0,0,0,.35),0 8px 22px rgba(0,0,0,.28); color-scheme:dark}
  :root:not([data-theme="light"])[data-inst="ufv"]{--brand:#7FA6FF}
  :root:not([data-theme="light"])[data-inst="esic"]{--brand:#F5A65C}
}
:root[data-theme="dark"]{
  --bg:#0D1124; --surface:#161C36; --surface-2:#1C2342; --ink:#E9ECF6; --muted:#9CA5C2; --line:#2B3459;
  --night:#080B1C; --night-2:#141A3C; --gold-soft:#3A2E14; --gold-deep:#F2C564;
  --brand:#8C97FF; --brand-ink:#0D1124; --ok:#4CC28C; --danger:#F06A7C;
  --lv1:#E0A465; --lv2:#B8A0F0; --lv3:#F2A45A; --lv4:#86A2F5; --lv5:#F0C24A;
  --shadow:0 1px 2px rgba(0,0,0,.35),0 8px 22px rgba(0,0,0,.28); color-scheme:dark}
:root[data-theme="dark"][data-inst="ufv"]{--brand:#7FA6FF}
:root[data-theme="dark"][data-inst="esic"]{--brand:#F5A65C}

*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
.wrap{max-width:1240px;margin:0 auto;padding-inline:20px}
@media (max-width:520px){.wrap{padding-inline:16px}}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;letter-spacing:-.015em}
h2{font-size:26px;font-weight:800}
h3{font-size:18px;font-weight:700}
.muted{color:var(--muted)}
.eyebrow{text-transform:uppercase;letter-spacing:.09em;font-size:12px;font-weight:700;color:var(--muted)}
.coin{width:30px;height:30px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ffffff80 0 18%,transparent 19%),var(--gold);box-shadow:inset 0 0 0 3px var(--gold-deep);display:inline-block;flex:none}

/* Buttons & form bits */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 16px;border-radius:12px;border:1px solid transparent;font-weight:700;background:var(--brand);color:var(--brand-ink);text-decoration:none;white-space:nowrap}
.btn.big{padding:14px 22px;font-size:17px;border-radius:14px}
.btn.ghost{background:var(--surface);color:var(--ink);border-color:var(--line)}
.btn.gold{background:var(--gold);color:#241703}
.btn.danger{background:transparent;color:var(--danger);border-color:color-mix(in srgb,var(--danger) 45%,transparent)}
.btn[disabled]{opacity:.45;cursor:default}
.btn svg,.iconbtn svg{width:18px;height:18px;flex:none}
.iconbtn{display:inline-flex;align-items:center;gap:6px;padding:8px 12px;border-radius:11px;border:1px solid var(--line);background:var(--surface);font-weight:700;font-size:14px;white-space:nowrap}
.iconbtn:hover,.btn.ghost:hover{border-color:var(--brand)}
.iconbtn[disabled]{opacity:.4;cursor:default}
.iconbtn[aria-pressed="true"]{border-color:var(--brand);color:var(--brand)}
.actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
label.f{display:grid;gap:6px;font-weight:700;font-size:14px;min-width:0}
label.f small{font-weight:400;color:var(--muted)}
.t{width:100%;padding:10px 12px;border-radius:11px;border:1px solid var(--line);background:var(--surface-2)}
textarea.t{min-height:150px;resize:vertical;font-size:14px}
.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px}
.panel{background:var(--surface);border-radius:20px;box-shadow:var(--shadow);padding:22px}
.stack{display:grid;gap:18px}
.note{font-size:13px;color:var(--muted);border-left:3px solid var(--gold);padding:8px 12px;background:var(--gold-soft);border-radius:0 10px 10px 0}
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:700;background:var(--surface-2);color:var(--muted);line-height:1.25}
.chip.lv{color:var(--c);background:color-mix(in srgb,var(--c) 15%,transparent)}
.chip.lv::before{content:"";width:8px;height:8px;border-radius:50%;background:currentColor;flex:none}
.inst{display:inline-flex;align-items:center;padding:3px 10px;border-radius:999px;font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--b);background:color-mix(in srgb,var(--b) 14%,transparent)}
.pill{display:inline-flex;align-items:center;padding:6px 12px;border-radius:999px;background:color-mix(in srgb,var(--brand) 14%,transparent);color:var(--brand);font-weight:700;font-size:13px;white-space:nowrap}

/* App bar */
.appbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.appbar .bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding-block:10px}
.brandmark{display:flex;align-items:center;gap:10px;font-family:var(--f-display);font-weight:800;font-size:21px;border:0;background:none;padding:0}
.subjtitle{display:grid;min-width:0;margin-right:auto}
.subjtitle b{font-family:var(--f-display);font-size:19px;line-height:1.15;overflow-wrap:anywhere}
.subjtitle small{color:var(--muted)}
.spacer{margin-right:auto}
.store{font-size:12px;color:var(--muted);display:inline-flex;gap:6px;align-items:center}
.store i{width:8px;height:8px;border-radius:50%;background:var(--ok)}
.store.local i{background:var(--gold)}
.store.err i{background:var(--danger)}
.store.err{color:var(--danger)}
.hide-sm{}
@media (max-width:640px){.hide-sm{display:none}}

main{padding-block:22px 70px}

/* Home */
.hero{position:relative;background:var(--night);color:var(--on-night);border-radius:26px;overflow:hidden;box-shadow:var(--shadow);display:grid}
.hero .art{grid-area:1/1;aspect-ratio:1800/764;max-width:100%;width:100%;min-height:300px}
.hero .art img{width:100%;height:100%;object-fit:cover;display:block}
.hero .txt{grid-area:1/1;align-self:end;padding:120px 36px 30px;display:grid;gap:12px;background:linear-gradient(180deg,transparent 0,rgba(9,12,30,.55) 35%,rgba(9,12,30,.9) 100%)}
.hero .eyebrow{color:var(--gold)}
.hero h1{font-size:clamp(32px,4.8vw,58px);font-weight:800;line-height:1.02;text-shadow:0 2px 18px rgba(0,0,0,.5)}
.hero p{margin:0;color:#DCE1F2;max-width:60ch;font-size:16px;text-shadow:0 1px 8px rgba(0,0,0,.5)}
@media (max-width:760px){.hero .art{grid-area:auto;min-height:0}.hero .txt{grid-area:auto;padding:20px 22px 24px;background:var(--night)}}
.sec-head{display:flex;justify-content:space-between;align-items:end;gap:12px;flex-wrap:wrap;margin:34px 0 14px}
.subjects{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:16px}
.subj{position:relative;text-align:left;border:0;background:var(--surface);border-radius:20px;box-shadow:var(--shadow);padding:20px;display:grid;gap:12px;border-top:6px solid var(--b);transition:transform .15s ease}
.subj:hover{transform:translateY(-2px)}
.subj h3{font-size:20px;line-height:1.15}
.subj .meta{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;font-size:13px;color:var(--muted);line-height:1.25}
.subj .meta b{display:block;font-family:var(--f-display);font-size:22px;color:var(--ink);font-variant-numeric:tabular-nums}
.subj .go{display:flex;justify-content:space-between;align-items:center;font-weight:700;color:var(--b)}
.subj.new{border:2px dashed var(--line);box-shadow:none;background:transparent;place-items:center;min-height:200px;color:var(--muted);font-weight:700}
.subj.new span{font-size:40px;line-height:1;color:var(--brand)}
.ladder{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:14px}
@media (max-width:980px){.ladder{grid-template-columns:repeat(auto-fill,minmax(190px,1fr))}}
.rung{background:var(--surface);border-radius:20px;box-shadow:var(--shadow);overflow:hidden;display:grid;align-content:start}
.rung .pic{aspect-ratio:1;max-width:100%;width:100%;object-fit:cover;display:block;background:color-mix(in srgb,var(--c) 25%,var(--surface-2))}
.rung .body{padding:14px 16px 16px;display:grid;gap:6px;border-top:4px solid var(--c)}
.rung .lvn{font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--c)}
.rung b{font-family:var(--f-display);font-size:18px;line-height:1.15}
.rung p{margin:0;font-size:14px;color:var(--muted)}
.datacard{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px;align-items:start}
.datacard .panel{display:grid;gap:10px;align-content:start}

/* Subject: mode switch */
.modes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-bottom:16px}
.mode{border:2px solid var(--line);background:var(--surface);border-radius:16px;padding:12px 14px;text-align:left;display:grid;gap:2px}
.mode b{font-family:var(--f-display);font-size:17px}
.mode small{color:var(--muted);font-size:13px}
.mode[aria-pressed="true"]{border-color:var(--brand);background:color-mix(in srgb,var(--brand) 9%,var(--surface))}
.mode[aria-pressed="true"] b{color:var(--brand)}
@media (max-width:620px){.modes{grid-template-columns:1fr}.mode small{display:none}}

/* Meter */
.meter{background:var(--surface);border-radius:18px;box-shadow:var(--shadow);padding:16px 20px;display:grid;grid-template-columns:auto 1fr auto;gap:8px 20px;align-items:center;margin-bottom:18px}
.meter .big{font-family:var(--f-display);font-weight:800;font-size:28px;line-height:1;font-variant-numeric:tabular-nums}
.meter .big small{font-size:.5em;color:var(--muted)}
.track{height:16px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line);overflow:hidden}
.fill{height:100%;border-radius:999px;background:repeating-linear-gradient(-45deg,var(--gold) 0 12px,color-mix(in srgb,var(--gold) 80%,#fff) 12px 24px);transition:width .5s cubic-bezier(.2,.8,.2,1)}
.meter.done .fill{background:repeating-linear-gradient(-45deg,var(--ok) 0 12px,color-mix(in srgb,var(--ok) 78%,#fff) 12px 24px)}
.meter .rw{grid-column:1/-1;font-size:13px;color:var(--muted)}
.meter .rw b{color:var(--ink)}
@media (max-width:620px){.meter{grid-template-columns:1fr}}

/* Libre grid */
.toolbar{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.search{flex:1 1 220px;min-width:0;padding:10px 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface)}
.switch{display:inline-flex;gap:8px;align-items:center;font-size:14px;color:var(--muted);user-select:none}
.switch input{width:18px;height:18px;accent-color:var(--brand)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px}
.card{position:relative;text-align:left;border:2px solid transparent;background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);padding:14px 14px 12px;display:flex;flex-direction:column;gap:10px;min-height:120px;transition:transform .12s ease,border-color .2s;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.card:hover{border-color:color-mix(in srgb,var(--brand) 45%,transparent)}
.card:active{transform:scale(.97)}
.card .nm{display:flex;flex-direction:column;min-width:0}
.card .nm b{font-family:var(--f-display);font-weight:700;font-size:19px;line-height:1.1;overflow-wrap:anywhere}
.card .nm small{color:var(--muted);font-size:13px;overflow-wrap:anywhere}
.card .av{position:absolute;top:10px;right:10px;width:40px;height:40px;border-radius:50%;object-fit:cover;box-shadow:0 0 0 2.5px var(--c)}
.card.has-av .nm{padding-right:44px}
.card.lmax{border-color:var(--lv5);background:linear-gradient(160deg,color-mix(in srgb,var(--lv5) 15%,var(--surface)),var(--surface) 60%)}
.dots{display:flex;flex-wrap:wrap;gap:4px;margin-top:auto}
.dots i{width:13px;height:13px;border-radius:50%;background:var(--surface-2);box-shadow:inset 0 0 0 1.5px var(--line)}
.dots i.on{background:var(--gold);box-shadow:inset 0 0 0 2px var(--gold-deep)}
.dots i.pop{animation:pop .45s cubic-bezier(.3,1.6,.5,1)}
.card .meta{display:flex;justify-content:space-between;align-items:flex-end;gap:6px;font-size:13px}
.count{font-variant-numeric:tabular-nums;color:var(--muted);font-weight:700}
.card.bump{animation:bump .35s ease}
.card.full{animation:shake .3s ease}
.grid.compact .dots,.grid.compact .meta,.grid.compact .av{display:none}
.grid.compact .card{min-height:74px;justify-content:center}
.grid.compact .card.has-av .nm{padding-right:0}
.grid.compact .card.lmax{border-color:transparent;background:var(--surface)}
.plus{position:absolute;right:14px;bottom:30px;font-family:var(--f-display);font-weight:800;font-size:24px;color:var(--gold-deep);pointer-events:none;animation:rise .9s ease-out forwards}

/* Stage for ruleta / amigo */
.stage{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr);gap:20px;align-items:start}
@media (max-width:860px){.stage{grid-template-columns:1fr}.stage > .stack{order:-1}}
.wheelbox{background:var(--surface);border-radius:24px;box-shadow:var(--shadow);padding:20px;display:grid;justify-items:center;gap:14px}
.wheelwrap{position:relative;width:min(100%,460px);aspect-ratio:1}
.wheelwrap canvas{width:100%;height:100%;display:block}
.pointer{position:absolute;left:50%;top:-6px;transform:translateX(-50%);width:0;height:0;border-left:16px solid transparent;border-right:16px solid transparent;border-top:30px solid var(--ink);filter:drop-shadow(0 2px 3px rgba(0,0,0,.3));z-index:2}
.hub{position:absolute;left:50%;top:50%;width:18%;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;background:var(--surface);box-shadow:0 0 0 5px var(--gold),var(--shadow);display:grid;place-items:center}
.hub .coin{width:55%;height:55%}
.pool{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;flex-wrap:wrap}
.result{background:var(--surface);border-radius:24px;box-shadow:var(--shadow);padding:22px;display:grid;gap:14px;align-content:start;min-height:100%}
.result .who{font-family:var(--f-display);font-weight:800;font-size:clamp(34px,5vw,56px);line-height:1;letter-spacing:-.02em;color:var(--brand);overflow-wrap:anywhere}
.result .sur{font-size:18px;color:var(--muted);margin-top:-6px}
.result.reveal .who{animation:zoomin .5s cubic-bezier(.2,1.4,.4,1)}
.result .empty-hint{color:var(--muted);font-size:15px}
.done-list{display:flex;flex-wrap:wrap;gap:6px}
.done-list span{font-size:13px;padding:3px 10px;border-radius:999px;background:var(--surface-2);color:var(--muted);text-decoration:line-through}
.numpad{display:flex;gap:10px;flex-wrap:wrap;align-items:stretch}
.numpad input{width:130px;font-family:var(--f-display);font-size:30px;font-weight:800;text-align:center;padding:8px 10px;border-radius:14px;border:2px solid var(--line);background:var(--surface-2)}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(74px,1fr));gap:8px}
.tile{perspective:600px;border:0;background:none;padding:0;aspect-ratio:1/1.05;max-width:100%}
.tile .in{position:relative;display:block;width:100%;height:100%;transition:transform .6s cubic-bezier(.3,1.3,.5,1);transform-style:preserve-3d}
.tile.open .in{transform:rotateY(180deg)}
.tile .fr,.tile .bk{position:absolute;inset:0;border-radius:14px;display:grid;place-items:center;backface-visibility:hidden;-webkit-backface-visibility:hidden;padding:4px;text-align:center}
.tile .fr{background:linear-gradient(150deg,var(--brand),color-mix(in srgb,var(--brand) 60%,var(--night)));color:var(--brand-ink);font-family:var(--f-display);font-weight:800;font-size:26px;box-shadow:var(--shadow)}
.tile .bk{transform:rotateY(180deg);background:var(--surface-2);border:1px solid var(--line);color:var(--muted);font-size:12px;font-weight:700;line-height:1.15;overflow:hidden;overflow-wrap:anywhere}
.tile .bk b{display:block;font-family:var(--f-display);font-size:13px;color:var(--ink)}
.tile.last .bk{background:color-mix(in srgb,var(--brand) 16%,var(--surface));border-color:var(--brand)}

/* Mini ladder in subject */
.miniladder{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-top:24px}
.mrung{display:flex;gap:10px;align-items:center;background:var(--surface);border-radius:14px;box-shadow:var(--shadow);padding:8px 12px 8px 8px;border-left:4px solid var(--c);min-width:0}
.mrung img,.mrung .ph{width:48px;height:48px;border-radius:12px;object-fit:cover;flex:none;background:color-mix(in srgb,var(--c) 22%,var(--surface-2))}
.mrung div{display:grid;min-width:0}
.mrung b{font-family:var(--f-display);font-size:14px;line-height:1.15}
.mrung small{color:var(--muted);font-size:12px}

/* Tables */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.stat{background:var(--surface);border-radius:14px;box-shadow:var(--shadow);padding:14px 16px}
.stat .v{font-family:var(--f-display);font-weight:800;font-size:28px;font-variant-numeric:tabular-nums;line-height:1.1}
.seg{display:inline-flex;background:var(--surface-2);border:1px solid var(--line);border-radius:11px;padding:3px}
.seg button{border:0;background:transparent;padding:6px 12px;border-radius:8px;font-weight:700;font-size:14px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.tablewrap{overflow-x:auto;border-radius:14px;border:1px solid var(--line);background:var(--surface)}
table{border-collapse:collapse;width:100%;min-width:660px;font-variant-numeric:tabular-nums}
th,td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);background:var(--surface-2);font-weight:700}
tr:last-child td{border-bottom:0}
td.pos{font-family:var(--f-display);font-weight:800;color:var(--muted);width:44px}
.minibar{display:flex;align-items:center;gap:8px}
.minibar span{flex:1;height:8px;border-radius:999px;background:var(--surface-2);min-width:60px;overflow:hidden}
.minibar span i{display:block;height:100%;background:var(--gold);border-radius:999px}
.adj{display:inline-flex;gap:4px}
.adj button{width:30px;height:30px;border-radius:8px;border:1px solid var(--line);background:var(--surface);font-weight:800}
.zero{display:flex;flex-wrap:wrap;gap:6px}
.zero span{padding:4px 10px;border-radius:999px;background:var(--surface-2);border:1px dashed var(--line);font-size:13px}

/* Config */
.cfg-nav{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.lvrow{display:grid;grid-template-columns:72px minmax(0,1fr) auto;gap:14px;align-items:center;padding:10px;border-radius:14px;background:var(--surface-2);border-left:4px solid var(--c)}
.lvrow .thumb{width:72px;height:72px;border-radius:12px;object-fit:cover;background:color-mix(in srgb,var(--c) 18%,var(--surface))}
.lvrow .lvf{display:grid;gap:6px;min-width:0}
.lvrow .lvf small{color:var(--muted);font-weight:700;font-size:12px;text-transform:uppercase;letter-spacing:.06em}
@media (max-width:640px){.lvrow{grid-template-columns:60px minmax(0,1fr)}.lvrow .thumb{width:60px;height:60px}.lvrow .actions{grid-column:1/-1}}
.stlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:6px;max-height:360px;overflow:auto;padding:2px}
.stlist div{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:6px 10px;border-radius:10px;background:var(--surface-2);font-size:14px;min-width:0}
.stlist div > span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.stlist .x{border:0;background:transparent;color:var(--muted);font-size:18px;line-height:1;padding:0 4px}
.stlist .x:hover{color:var(--danger)}
.trato{border:1px solid var(--line);background:var(--surface);border-radius:999px;font-size:12px;padding:1px 8px;color:var(--muted);min-width:48px}
.trato[data-v="o"],.trato[data-v="a"]{color:var(--brand);border-color:var(--brand)}
.instpick{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.instpick button{border:2px solid var(--line);background:var(--surface);border-radius:12px;padding:10px;font-weight:800;display:grid;gap:6px;justify-items:center}
.instpick button i{width:100%;height:10px;border-radius:999px;background:var(--b)}
.instpick button[aria-pressed="true"]{border-color:var(--b);color:var(--b)}

/* Empty / modal / toast */
.empty{text-align:center;padding:48px 20px;display:grid;gap:12px;justify-items:center}
.empty .coin{width:56px;height:56px;box-shadow:inset 0 0 0 5px var(--gold-deep)}
.modal{position:fixed;inset:0;z-index:50;display:grid;place-items:center;padding:16px;background:rgba(8,11,28,.55)}
.modal .box{background:var(--surface);border-radius:20px;max-width:580px;width:100%;padding:22px;display:grid;gap:14px;max-height:90vh;overflow:auto;box-shadow:0 20px 50px rgba(0,0,0,.35)}
.toasts{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);display:grid;gap:8px;z-index:90;width:min(460px,calc(100% - 32px))}
.toast{background:var(--ink);color:var(--bg);border-radius:12px;padding:10px 14px;display:flex;gap:12px;align-items:center;justify-content:space-between;box-shadow:0 8px 24px rgba(0,0,0,.25);font-size:14px;animation:rise2 .25s ease}
.toast button{border:0;background:transparent;color:var(--gold);font-weight:800}
.banner{display:flex;gap:12px;align-items:center;padding:12px 16px;border-radius:14px;background:color-mix(in srgb,var(--ok) 14%,var(--surface));border:1px solid color-mix(in srgb,var(--ok) 40%,transparent);margin-bottom:14px;font-weight:700}
.warnbar{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:10px 14px;border-radius:14px;background:var(--gold-soft);margin-bottom:16px;font-size:14px}
.confetti{position:fixed;width:8px;height:12px;border-radius:2px;pointer-events:none;z-index:95;animation:fall 1.1s ease-out forwards}

/* Celebration overlay: always a dark stage */
.celebrate{position:fixed;inset:0;z-index:80;display:grid;place-items:center;padding:20px;background:radial-gradient(circle at 50% 38%,color-mix(in srgb,var(--c) 45%,#0B1020) 0,#0B1020 72%);color:#FFFFFF;cursor:pointer;animation:fadein .3s ease}
.celebrate .inner{display:grid;gap:14px;justify-items:center;text-align:center;max-width:780px}
.celebrate .pic{width:min(48vh,380px);height:min(48vh,380px);border-radius:32px;object-fit:cover;box-shadow:0 0 0 6px var(--c),0 30px 90px rgba(0,0,0,.55);animation:zoom .8s cubic-bezier(.2,1.4,.4,1);background:color-mix(in srgb,var(--c) 60%,#0B1020)}
.celebrate.mini .pic{width:min(34vh,240px);height:min(34vh,240px)}
.celebrate .k{letter-spacing:.16em;text-transform:uppercase;font-weight:700;font-size:15px;color:#DDE3F5}
.celebrate h1{font-weight:800;font-size:clamp(36px,6.5vw,72px);line-height:1.02;letter-spacing:-.02em}
.celebrate.mini h1{font-size:clamp(28px,4.5vw,48px)}
.celebrate p{font-family:var(--f-display);font-size:clamp(20px,3vw,32px);margin:0;font-weight:700;color:#FFD978;text-wrap:balance}
.celebrate .d{font-family:var(--f-body);font-size:17px;color:#C9D0E6;font-weight:400}
.celebrate small{color:#AEB8D3}

@keyframes pop{0%{transform:scale(.2)}100%{transform:scale(1)}}
@keyframes bump{40%{transform:scale(1.04)}}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
@keyframes rise{0%{opacity:0;transform:translateY(8px) scale(.7)}25%{opacity:1;transform:translateY(-4px) scale(1.1)}100%{opacity:0;transform:translateY(-34px)}}
@keyframes rise2{from{opacity:0;transform:translateY(8px)}}
@keyframes fall{to{transform:translate(var(--dx),var(--dy)) rotate(var(--rot));opacity:0}}
@keyframes zoom{from{transform:scale(.3) rotate(-10deg);opacity:0}}
@keyframes zoomin{from{transform:scale(.6);opacity:0}}
@keyframes fadein{from{opacity:0}}

<body>
<header class="appbar" id="appbar"></header>
<main class="wrap" id="main"><div class="empty"><span class="coin" aria-hidden="true"></span><h2>Cargando tus asignaturas…</h2><p class="muted">Un momento.</p></div></main>
<div class="toasts" id="toasts" aria-live="polite"></div>
<div id="modalRoot"></div>
<script src="config.js"></script>
<script>
/* ---------- Storage adapter: cloud (claude.ai artifact db) or local (browser, optionally synced to Google Sheets) ---------- */
const Store = (() => {
  const OFF_KEY = "fichas-data-v2";        // offline data (this computer)
  const SHEET_KEY = "fichas-sheet-data";   // local copy of the sheet data (session or remembered)
  const CFG_KEY = "fichas:sync", PASS_KEY = "fichas:clave";
  const SUBS = ["students", "questions"];
  let mode = "local", db = null, dl = null, assets = null;
  const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
  const plain = snap => snap.docs.map(d => ({id: d.id, ...d.data()}));
  const ls = {
    get(store, k){ try{ return store.getItem(k); }catch{ return null; } },
    set(store, k, v){ try{ store.setItem(k, v); return true; }catch{ return false; } },
    del(store, k){ try{ store.removeItem(k); }catch{} }
  };
  const parse = s => { try{ return JSON.parse(s); }catch{ return null; } };

  // ---- configuration & session (local mode)
  let cfg = {mode: null, url: "", base: 0, remember: false};
  const old = parse(ls.get(localStorage, CFG_KEY));
  if (old){
    cfg = {...cfg, ...old};
    if (old.clave){ ls.set(localStorage, PASS_KEY, old.clave); cfg.remember = true; delete cfg.clave; }   // migrate v5
  }
  const builtUrl = () => (window.FICHAS_CONFIG && window.FICHAS_CONFIG.scriptUrl) || "";
  const saveCfg = () => ls.set(localStorage, CFG_KEY, JSON.stringify(cfg));
  const sheetStore = () => cfg.remember ? localStorage : sessionStorage;
  const getPass = () => ls.get(sessionStorage, PASS_KEY) || ls.get(localStorage, PASS_KEY) || "";
  const url = () => cfg.url || builtUrl();
  const hasOffline = () => { const d = parse(ls.get(localStorage, OFF_KEY)); return !!(d && d.groups && Object.keys(d.groups).length); };
  function state(){
    if (mode === "cloud") return "cloud";
    if (cfg.mode === "local") return "offline";
    if (cfg.mode === "sheets" || url()) return getPass() && url() ? "ready" : "login";
    return hasOffline() ? "offline" : "welcome";
  }

  // ---- local data
  let L = {groups: {}};
  const subs = new Set(), sessionSubs = new Set();
  const dataKey = () => state() === "offline" ? [localStorage, OFF_KEY] : [sheetStore(), SHEET_KEY];
  function lload(){ const [st, k] = dataKey(); L = parse(ls.get(st, k)) || {groups: {}}; if (!L.groups) L.groups = {}; }
  function lsave(){ const [st, k] = dataKey(); return ls.set(st, k, JSON.stringify(L)); }
  function lnotify(){ queueMicrotask(() => subs.forEach(fn => { try{ fn(); }catch(e){ console.error(e); } })); }
  function sessionNotify(){ queueMicrotask(() => sessionSubs.forEach(fn => { try{ fn(state()); }catch(e){ console.error(e); } })); }
  function lwrite(fn){ fn(); L.updatedAt = Date.now(); if (!lsave()) throw {code: "quota_exceeded"}; lnotify(); Sync.schedule(); return Promise.resolve(); }

  // ---- merge two full datasets (used when two computers saved in between)
  const uniq = (x = [], y = []) => [...new Set([...(x || []), ...(y || [])])].sort((m, n) => m - n);
  const uniqAns = (x = [], y = []) => { const seen = new Set(), out = []; [...(x || []), ...(y || [])].forEach(a => { const k = a.t + "|" + a.q; if (!seen.has(k)){ seen.add(k); out.push(a); } }); return out.sort((a, b) => a.t - b.t); };
  function merge(a, b){
    const out = {groups: {}, updatedAt: Date.now()}, ga = (a && a.groups) || {}, gb = (b && b.groups) || {};
    new Set([...Object.keys(ga), ...Object.keys(gb)]).forEach(id => {
      const x = ga[id], y = gb[id];
      if (!x || !y){ out.groups[id] = JSON.parse(JSON.stringify(x || y)); return; }
      const g = {...y, ...x, students: {}, questions: {}};
      const sx = x.students || {}, sy = y.students || {};
      new Set([...Object.keys(sx), ...Object.keys(sy)]).forEach(sid => {
        const u = sx[sid], v = sy[sid];
        g.students[sid] = !u || !v ? {...(u || v)} : {...v, ...u, p1: uniq(u.p1, v.p1), p2: uniq(u.p2, v.p2), ans: uniqAns(u.ans, v.ans)};
      });
      const qx = x.questions || {}, qy = y.questions || {};
      new Set([...Object.keys(qx), ...Object.keys(qy)]).forEach(qid => {
        const u = qx[qid], v = qy[qid];
        g.questions[qid] = !u || !v ? {...(u || v)} : {...v, ...u, used: uniq(u.used, v.used)};
      });
      out.groups[id] = g;
    });
    return out;
  }

  // ---- Google Sheets sync
  const Sync = (() => {
    let timer = null, dirty = false, busy = false, status = {state: "off", at: 0, msg: ""}, listeners = new Set();
    const setStatus = (st, msg = "") => { status = {state: st, msg, at: Date.now()}; listeners.forEach(fn => { try{ fn(status); }catch{} }); };
    const on = () => state() === "ready";
    const errMsg = e => e && e.code === "clave" ? "La contraseña no coincide con la del script." : e && e.code === "bloqueado" ? "Demasiados intentos fallidos: espera 10 minutos." : "Sin conexión con la hoja. Se reintentará.";
    async function get(u = url(), clave = getPass()){
      const r = await fetch(u + (u.includes("?") ? "&" : "?") + "clave=" + encodeURIComponent(clave), {cache: "no-store"});
      const j = await r.json();
      if (!j.ok) throw {code: j.error || "error"};
      return j.data || null;
    }
    async function post(force){
      const r = await fetch(url(), {method: "POST", headers: {"Content-Type": "text/plain;charset=utf-8"}, body: JSON.stringify({clave: getPass(), base: cfg.base, forzar: !!force, data: L})});
      return r.json();
    }
    async function push(force){
      if (!on() || busy) return; busy = true; clearTimeout(timer);
      setStatus("saving");
      try{
        const sent = L.updatedAt || Date.now();
        let j = await post(force);
        if (!j.ok && j.error === "conflicto"){ L = merge(L, j.data); lsave(); lnotify(); j = await post(true); }
        if (!j.ok) throw {code: j.error};
        cfg.base = L.updatedAt || sent; saveCfg();
        dirty = (L.updatedAt || 0) > sent;
        setStatus("ok");
        if (dirty) timer = setTimeout(() => push(), 800);
      }catch(e){
        setStatus("error", errMsg(e));
        if (!(e && (e.code === "clave" || e.code === "bloqueado"))) timer = setTimeout(() => push(), 30000);
      }finally{ busy = false; }
    }
    async function pull(){
      if (!on() || busy || dirty) return;
      busy = true; setStatus("pulling");
      try{
        const remote = await get();
        busy = false;
        const rT = (remote && remote.updatedAt) || 0, lT = L.updatedAt || 0;
        if (remote && rT > lT){ L = {groups: remote.groups || {}, updatedAt: rT}; lsave(); lnotify(); cfg.base = rT; saveCfg(); setStatus("ok"); }
        else if (lT > rT){ dirty = true; await push(); }
        else setStatus("ok");
      }catch(e){ busy = false; setStatus("error", e && e.code ? errMsg(e) : "No se pudo leer la hoja. Trabajas con la copia de este ordenador."); }
    }
    document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") pull(); });
    window.addEventListener("pagehide", () => {
      if (on() && dirty && navigator.sendBeacon){ try{ navigator.sendBeacon(url(), new Blob([JSON.stringify({clave: getPass(), base: cfg.base, forzar: false, data: L})], {type: "text/plain"})); }catch{} }
    });
    return {
      get status(){ return status; },
      get dirty(){ return dirty; },
      onStatus(fn){ listeners.add(fn); return () => listeners.delete(fn); },
      schedule(){ if (!on()) return; dirty = true; setStatus("pending"); clearTimeout(timer); timer = setTimeout(() => push(), 2500); },
      pull, push, get, merge,
      reset(){ clearTimeout(timer); dirty = false; busy = false; setStatus("off"); }
    };
  })();

  // ---- local helpers
  const lgroupData = g => { const {students, questions, ...rest} = g; return rest; };
  const lsub = (gid, sub) => Object.entries((L.groups[gid] || {})[sub] || {}).map(([id, s]) => ({id, ...s}));
  const lsubWrite = (gid, sub, fn) => lwrite(() => { const g = L.groups[gid]; if (!g) return; g[sub] = g[sub] || {}; fn(g[sub]); });

  // ---- cloud helpers
  const ccol = (gid, sub) => db.collection(`groups/${gid}/${sub}`);
  const cdoc = (gid, sub, id) => db.doc(`groups/${gid}/${sub}/${id}`);

  const api = {
    get mode(){ return mode; },
    get sync(){ return Sync; },
    get canDownload(){ return mode === "local" || !!dl; },
    get canUploadImages(){ return mode === "local" || !!assets; },
    newId: uid,

    // ---- session (local mode only)
    get session(){ return {state: state(), url: url(), builtUrl: builtUrl(), remember: !!cfg.remember, hasOffline: hasOffline()}; },
    onSession(fn){ sessionSubs.add(fn); return () => sessionSubs.delete(fn); },
    async testConnection(u, clave){ return await Sync.get(u, clave); },
    /** Logs in: stores url + password, loads remote data. choice: how to combine with this computer's offline data ("remote" | "merge" | "local"). */
    async login(u, clave, remember, remote, choice = "remote"){
      Sync.reset();
      cfg.mode = "sheets"; cfg.url = u === builtUrl() ? "" : u; cfg.remember = !!remember; cfg.base = 0; saveCfg();
      ls.del(localStorage, PASS_KEY); ls.del(sessionStorage, PASS_KEY);
      ls.set(remember ? localStorage : sessionStorage, PASS_KEY, clave);
      lload();                                    // previous copy on this computer (if any)
      const offline = choice === "remote" ? null : parse(ls.get(localStorage, OFF_KEY));
      let next = remote ? {groups: remote.groups || {}, updatedAt: remote.updatedAt || 0} : {groups: {}, updatedAt: 0};
      if (Object.keys(L.groups).length) next = merge(next, L);
      if (offline && offline.groups) next = choice === "local" && !remote ? offline : merge(next, offline);
      const needPush = !remote || next.updatedAt > (remote.updatedAt || 0) || !!offline || Object.keys(L.groups).length > 0;
      L = next; if (!L.updatedAt) L.updatedAt = Date.now();
      cfg.base = remote ? remote.updatedAt || 0 : 0; saveCfg();
      lsave(); lnotify(); sessionNotify();
      if (needPush){ L.updatedAt = Date.now(); lsave(); await Sync.push(true); }
      else Sync.pull();
    },
    async logout(){
      if (Sync.dirty) { try{ await Sync.push(); }catch{} }
      ls.del(localStorage, PASS_KEY); ls.del(sessionStorage, PASS_KEY);
      ls.del(localStorage, SHEET_KEY); ls.del(sessionStorage, SHEET_KEY);
      cfg.mode = "sheets"; cfg.base = 0; saveCfg();
      Sync.reset(); L = {groups: {}}; lnotify(); sessionNotify();
    },
    useOffline(){ Sync.reset(); cfg.mode = "local"; saveCfg(); lload(); lnotify(); sessionNotify(); },
    toWelcome(){ Sync.reset(); cfg.mode = null; cfg.url = ""; saveCfg(); ls.del(localStorage, PASS_KEY); ls.del(sessionStorage, PASS_KEY); L = {groups: {}}; lnotify(); sessionNotify(); },
    configFile(u = url()){ return `// Fichas de participación · configuración\n// Dirección de la aplicación web de tu hoja (no es secreta: sin la contraseña no da acceso a nada).\nwindow.FICHAS_CONFIG = {\n  scriptUrl: ${JSON.stringify(u)}\n};\n`; },
    linkFor(base){ const t = btoa(unescape(encodeURIComponent(JSON.stringify({u: url(), k: getPass()})))).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, ""); return base + "#conectar=" + t; },
    fromHash(){
      const m = /[#&]conectar=([A-Za-z0-9_-]+)/.exec(location.hash || ""); if (!m) return null;
      try{ history.replaceState(null, "", location.pathname + location.search); }catch{}
      try{ const j = JSON.parse(decodeURIComponent(escape(atob(m[1].replace(/-/g, "+").replace(/_/g, "/"))))); return j.u && j.k ? {url: j.u, clave: j.k} : null; }catch{ return null; }
    },

    async init(){
      const c = window.claude;
      if (c && typeof c.use === "function"){
        const [d, w, a] = await Promise.all(["db", "downloads", "assets"].map(n => c.use(n).catch(() => null)));
        if (d){ db = d; dl = w; assets = a; mode = "cloud"; return mode; }
      }
      mode = "local";
      lload();
      window.addEventListener("storage", e => { if (e.key === OFF_KEY || e.key === SHEET_KEY){ lload(); lnotify(); } });
      if (state() === "ready") Sync.pull();
      return mode;
    },

    // ---- groups
    onGroups(cb){
      if (mode === "cloud") return db.collection("groups").onSnapshot(s => cb(plain(s)), () => cb(null));
      const fn = () => cb(Object.entries(L.groups).map(([id, g]) => ({id, ...lgroupData(g)}))); subs.add(fn); fn(); return () => subs.delete(fn);
    },
    onGroup(gid, cb){
      if (mode === "cloud") return db.doc("groups/" + gid).onSnapshot(s => cb(s.exists ? {id: s.id, ...s.data()} : null), () => {});
      const fn = () => { const g = L.groups[gid]; cb(g ? {id: gid, ...lgroupData(g)} : null); }; subs.add(fn); fn(); return () => subs.delete(fn);
    },

  function addToken(sid, from, ctx){
    const s = S.students.find(x => x.id === sid); if (!s) return false;
    const k = key(), arr = s[k] || [];
    if (arr.length >= maxT()){
      const card = document.querySelector(`.card[data-id="${sid}"]`);
      if (card){ card.classList.remove("full"); void card.offsetWidth; card.classList.add("full"); }
      toast(`${esc(splitName(s.name).first)} ya tiene el máximo (${maxT()} fichas = ${num(bonusMax())} pts).`);
      return false;
    }
    const before = levelOf(arr.length), gBefore = total(), ts = Date.now();
    s[k] = [...arr, ts];
    S.undo.push({sid, k, ts}); if (S.undo.length > 60) S.undo.shift();
    writeStudent(sid, {[k]: s[k]});
    render();
    const after = levelOf(s[k].length);
    if (after <= before) SFX.token();
    if (from === "card"){
      const card = document.querySelector(`.card[data-id="${sid}"]`);
      if (card){
        card.classList.add("bump");
        const p = document.createElement("span"); p.className = "plus"; p.textContent = "+1"; card.appendChild(p);
        const dots = card.querySelectorAll(".dots i.on"); dots[dots.length - 1]?.classList.add("pop");
      }
    }
    if (after > before) celebrate(s, after, ctx);
    const g = goal(), tag = S.gid + ":" + period();
    if (gBefore < g && total() >= g && !S.goalCelebrated[tag]){
      S.goalCelebrated[tag] = true;
      setTimeout(() => { confetti(innerWidth / 2, 160, 70); toast(`¡Meta de la clase conseguida! ${G().reward ? esc(G().reward) : ""}`, null, 7000); }, after > before ? 3000 : 0);
    }
    return ts;
  }
  function removeToken(sid, ts){
    const s = S.students.find(x => x.id === sid); if (!s) return false;
    const k = key(), arr = s[k] || []; if (!arr.length) return false;
    let i = ts ? arr.lastIndexOf(ts) : arr.length - 1; if (i < 0) i = arr.length - 1;
    const gone = arr[i];
    s[k] = arr.filter((_, j) => j !== i);
    const patch = {[k]: s[k]};
    if ((s.ans || []).some(a => a.t === gone)){ s.ans = s.ans.filter(a => a.t !== gone); patch.ans = s.ans; }
    writeStudent(sid, patch); render(); return true;
  }
  function undo(){
    const u = S.undo.pop(); if (!u){ renderBar(); return; }
    if (u.k !== key()){ renderBar(); return; }
    const s = S.students.find(x => x.id === u.sid);
    if (removeToken(u.sid, u.ts)) toast(`Ficha retirada a ${esc(splitName(s.name).first)}.`);
  }

  function openSubject(gid, view = "subject"){
    if (S.gid !== gid){
      if (unsubGroup) unsubGroup(); if (unsubStud) unsubStud(); if (unsubQ) unsubQ();
      S.gid = gid; S.group = S.groups.find(g => g.id === gid) || null; S.students = []; S.undo = []; S.pick = null; S.profPeriod = null; S.query = "";
      S.questions = []; S.q = null; S.qTopic = pref.get("qtopic:" + gid, "");
      S.mode = pref.get("mode:" + gid, "libre");

        S.questions = list.map(x => (pending["q:" + x.id] > 0 && local[x.id]) ? local[x.id]
          : {id: x.id, topic: String(x.topic || "Sin tema"), q: String(x.q || ""), a: String(x.a || ""), exp: String(x.exp || ""), order: Number(x.order) || 0, used: [...(x.used || [])]})
          .sort((a, b) => a.order - b.order);

      unsubGroup = Store.onGroup(gid, g => {
        if (!g){ if (S.gid === gid) goHome(); return; }
        if (pending["g:" + gid] > 0 && S.group){ S.group = {...g, ...S.group}; } else S.group = g;
        render();

      unsubStud = Store.onStudents(gid, list => {
        const local = Object.fromEntries(S.students.map(s => [s.id, s]));
        S.students = list.map(x => (pending["s:" + x.id] > 0 && local[x.id]) ? local[x.id]
          : {id: x.id, name: String(x.name || "Sin nombre"), p1: [...(x.p1 || [])], p2: [...(x.p2 || [])], ans: [...(x.ans || [])], trato: x.trato || null}).sort(byName);
        render();
      });
    }
    S.view = view; window.scrollTo(0, 0); render();
  }

  // ---------- Student list import ----------
  function parseList(text){
    const seen = new Set(), out = [];
    text.split(/\r?\n/).forEach((line, i) => {
      line = line.replace(/^﻿/, "").trim(); if (!line) return;
      let cells = line.split(/\t|;/).map(c => c.replace(/^"|"$/g, "").trim()).filter(Boolean);
      if (cells.length === 1 && /,.*,/.test(line)) cells = line.split(",").map(c => c.replace(/^"|"$/g, "").trim()).filter(Boolean);
      cells = cells.filter(c => !/@/.test(c) && !/^[\d\s.\-\/]+$/.test(c));
      if (!cells.length) return;
      if (i === 0 && /^(nombre|apellidos?|alumno|estudiante|name)\b/i.test(cells[0])) return;
      // "Nombre;Apellidos" (2 columns, as in the CSV we generate) → "Apellidos, Nombre"
      const name = cells.length === 2 && !cells[0].includes(",") ? `${cells[1]}, ${cells[0]}` : cells.join(" ").replace(/\s+/g, " ");
      const k = name.toLocaleLowerCase("es"); if (seen.has(k)) return; seen.add(k); out.push(name);
    });
    return out;
  }

  // ---------- Excel ----------
  let xlsxP = null;

  const r2 = x => Math.round(x * 1000) / 1000;
  // One row per token and per incorrect answer, with the question when there was one
  function logRows(g, s, qmap){
    const {first, rest} = splitName(s.name), rows = [], ans = s.ans || [], byT = Object.fromEntries(ans.map(a => [a.t, a]));
    const row = (t, p, res, a) => { const d = new Date(t), q = a && qmap[a.q]; rows.push([g.name, g.groupLabel || "", rest, first, p, d.toLocaleDateString("es-ES"), d.toLocaleTimeString("es-ES", {hour: "2-digit", minute: "2-digit"}), res, q ? q.topic : "", q ? q.q : ""]); };
    [1, 2].forEach(p => (s["p" + p] || []).forEach(t => { const a = byT[t]; row(t, p, a ? "Correcta (+1)" : "Ficha", a); }));
    ans.filter(a => !a.ok).forEach(a => row(a.t, a.p || 1, "Incorrecta", a));
    return rows.sort((x, y) => (x[5] + x[6]).localeCompare(y[5] + y[6]));

        let nm = `${g.name}${g.groupLabel ? " " + g.groupLabel : ""}`.replace(/[\[\]:*?\/\\]/g, " ").slice(0, 28).trim() || "Asignatura", k = 2, base = nm;
        while (used.has(nm)) nm = `${base.slice(0, 26)} ${k++}`; used.add(nm);
        X.utils.book_append_sheet(wb, ws, nm);
      }
      const wl = X.utils.aoa_to_sheet(log); wl["!cols"] = [{wch: 30}, {wch: 12}, {wch: 28}, {wch: 16}, {wch: 8}, {wch: 12}, {wch: 8}, {wch: 14}, {wch: 22}, {wch: 60}];

      data.forEach(({g, st}) => { const m = Math.max(1, Number(g.max) || 10), v = val(g); st.forEach(s => { const {first, rest} = splitName(s.name), a = cntIn(s, 1, m), b = cntIn(s, 2, m); lines.push([g.name, g.groupLabel || "", rest, first, a, num(a * v, 3), b, num(b * v, 3), num((a + b) * v, 3)]); }); });
      const csv = "﻿" + lines.map(r => r.map(c => `"${String(c).replace(/"/g, '""')}"`).join(";")).join("\r\n");

      catch(e2){ if (!e2 || e2.code !== "declined") toast("No se pudo descargar el archivo."); }

  // ---------- Question import (CSV / Excel / JSON) ----------
  const normKey = k => String(k || "").toLocaleLowerCase("es").normalize("NFD").replace(/[̀-ͯ]/g, "").trim();
  const COLS = {topic: /^(tema|semana|topic|bloque|unidad|sesion)/, q: /^(pregunta|question|enunciado)/, a: /^(respuesta|answer|solucion|correcta)/, exp: /^(explicacion|explanation|justificacion|feedback|comentario)/};
  function parseCSV(text){
    text = text.replace(/^﻿/, "");
    const firstLine = text.split(/\r?\n/)[0] || "", count = ch => firstLine.split(ch).length - 1;
    const delim = [";", "\t", ","].sort((x, y) => count(y) - count(x))[0];
    const rows = []; let row = [], cell = "", inQ = false;
    for (let i = 0; i < text.length; i++){
      const c = text[i];
      if (inQ){ if (c === '"'){ if (text[i + 1] === '"'){ cell += '"'; i++; } else inQ = false; } else cell += c; }
      else if (c === '"') inQ = true;
      else if (c === delim){ row.push(cell); cell = ""; }
      else if (c === "\n" || c === "\r"){ if (c === "\r" && text[i + 1] === "\n") i++; row.push(cell); rows.push(row); row = []; cell = ""; }
      else cell += c;
    }
    if (cell || row.length){ row.push(cell); rows.push(row); }
    return rows.filter(r => r.some(c => String(c).trim()));
  }
  function rowsToQuestions(rows){
    if (!rows.length) return [];
    const head = rows[0].map(normKey), idx = {};
    Object.entries(COLS).forEach(([k, re]) => { idx[k] = head.findIndex(h => re.test(h)); });
    let body = rows.slice(1);
    if (idx.q < 0 || idx.a < 0){ body = rows; const n = rows[0].length; Object.assign(idx, n >= 3 ? {topic: 0, q: 1, a: 2, exp: n >= 4 ? 3 : -1} : {topic: -1, q: 0, a: 1, exp: -1}); }
    const cell = (r, i) => i >= 0 ? String(r[i] ?? "").trim() : "";
    return body.map(r => ({topic: cell(r, idx.topic) || "Sin tema", q: cell(r, idx.q), a: cell(r, idx.a), exp: cell(r, idx.exp)})).filter(x => x.q && x.a);
  }
  function objsToQuestions(arr){
    return arr.map(o => { const m = {}; Object.entries(o || {}).forEach(([k, v]) => { const nk = normKey(k); Object.entries(COLS).forEach(([key, re]) => { if (re.test(nk) && m[key] == null) m[key] = String(v ?? "").trim(); }); }); return {topic: m.topic || "Sin tema", q: m.q || "", a: m.a || "", exp: m.exp || ""}; }).filter(x => x.q && x.a);
  }
  async function readQuestionsFile(file){
    const name = file.name.toLowerCase();
    if (/\.xlsx?$/.test(name)){
      const X = await loadXLSX(), wb = X.read(await file.arrayBuffer(), {type: "array"});
      return rowsToQuestions(X.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], {header: 1, defval: "", raw: false}));
    }
    const text = await file.text();
    if (/\.json$/.test(name) || /^\s*[\[{]/.test(text)){
      const j = JSON.parse(text), arr = Array.isArray(j) ? j : (j.preguntas || j.questions || []);
      return objsToQuestions(arr);
    }
    return rowsToQuestions(parseCSV(text));
  }
  async function importQuestions(file){
    let list;
    try{ list = await readQuestionsFile(file); }
    catch(e){ toast(/\.xlsx?$/i.test(file.name) ? "No se pudo leer el Excel. Guárdalo como CSV y vuelve a intentarlo." : "No se pudo leer el archivo. Revisa que tenga las columnas Tema, Pregunta y Respuesta.", null, 6000); return; }
    if (!list.length){ toast("No se encontraron preguntas. El archivo necesita al menos las columnas Pregunta y Respuesta.", null, 6000); return; }
    const byTopic = {}; list.forEach(x => { byTopic[x.topic] = (byTopic[x.topic] || 0) + 1; });
    const base = S.questions.reduce((m, q) => Math.max(m, q.order), 0);
    confirmBox(`¿Añadir ${list.length} ${list.length === 1 ? "pregunta" : "preguntas"}?`,
      Object.entries(byTopic).map(([t, n]) => `${esc(t)}: ${n}`).join(" · "), "Añadir al banco",
      async () => { await Store.setItems(S.gid, "questions", list.map((x, i) => [Store.newId(), {...x, order: base + i + 1, used: []}])); toast(`${list.length} preguntas añadidas.`); });
  }
  const QUESTION_TEMPLATE = "Tema;Pregunta;Respuesta;Explicación\r\n" +
    "Semana 1 · Variables;¿Qué diferencia una variable independiente de una dependiente?;\"La independiente la manipula quien investiga; la dependiente es la que se mide para ver su efecto.\";\r\n" +
    "Semana 1 · Variables;¿Qué es una variable extraña?;Una variable distinta de la independiente que puede influir en la dependiente si no se controla.;Por eso se usan técnicas de control como la aleatorización.\r\n" +
    "Semana 2 · Diseños;¿Qué caracteriza a un diseño intrasujeto?;Que las mismas personas pasan por todas las condiciones.;\r\n";

  async function backup(){
    try{
      const d = await Store.dump();
      await Store.download(`fichas_copia_${new Date().toISOString().slice(0, 10)}.json`, JSON.stringify(d, null, 1), "application/json");
      pref.set("lastBackup", Date.now()); render();
    }catch(e){ if (!e || e.code !== "declined") toast("No se pudo descargar la copia."); }
  }
  function restore(file){
    const r = new FileReader();
    r.onload = () => {
      let obj; try{ obj = JSON.parse(String(r.result)); }catch{ toast("El archivo no es una copia válida."); return; }
      const n = Object.keys(obj.groups || {}).length; if (!n){ toast("La copia no contiene asignaturas."); return; }
      confirmBox("¿Restaurar la copia?", `Se cargarán ${n} asignaturas. Las que ya existan con el mismo identificador se sobrescribirán con los datos de la copia.`, "Restaurar", async () => { await Store.restore(obj); toast("Copia restaurada."); refreshSummary(); });
    };
    r.readAsText(file);
  }
  async function shrink(file){
    try{
      const bmp = await createImageBitmap(file), k = Math.min(1, 900 / Math.max(bmp.width, bmp.height));
      const c = document.createElement("canvas"); c.width = Math.round(bmp.width * k); c.height = Math.round(bmp.height * k);
      c.getContext("2d").drawImage(bmp, 0, 0, c.width, c.height);
      const blob = await new Promise(r => c.toBlob(r, "image/webp", .85));
      return blob && blob.size < file.size ? blob : file;
    }catch{ return file; }
  }
  async function uploadLevelImg(i, file){
    toast("Subiendo imagen…", null, 2500);
    try{
      const src = await Store.saveImage(await shrink(file));
      const levels = lvCfg().map(x => ({...x})), old = levels[i].img; levels[i].img = src;
      await writeGroup({levels}); if (old) Store.deleteImage(old);
      toast(`Imagen guardada para “${esc(levels[i].title)}”.`); render();
    }catch(e){ toast(e && e.code === "too_large" ? "La imagen es demasiado grande." : "No se pudo subir la imagen."); }
  }

  // ---------- Events ----------
  document.addEventListener("click", async e => {
    if (e.target.closest(".modal, .celebrate")) return;
    const card = e.target.closest(".card[data-id]");
    if (card){
      if (S.q && S.q.phase === "ask" && S.mode === "libre"){ S.q.sid = card.dataset.id; render(); return; }
      addToken(card.dataset.id, "card"); return;
    }
    const b = e.target.closest("[data-act]"); if (!b) return;
    const act = b.dataset.act, id = b.dataset.id;
    switch (act){
      case "home": goHome(); break;
      case "subject": S.view = "subject"; render(); break;
      case "open": openSubject(id); break;
      case "view": S.view = S.view === b.dataset.v ? "subject" : b.dataset.v; window.scrollTo(0, 0); render(); break;
      case "sound": S.sound = !S.sound; pref.set("sound", S.sound); renderBar(); if (S.sound) SFX.token(); break;
      case "undo": undo(); break;
      case "newgroup": newGroupModal(); break;
      case "mode": S.mode = b.dataset.v; pref.set("mode:" + S.gid, S.mode); S.pick = null; render(); break;
      case "spin": spin(); break;
      case "resetRoulette": writeGroup({rouletteUsed: []}); S.pick = null; render(); toast("La ruleta vuelve a tener a toda la clase."); break;
      case "resetFriend": writeGroup({friendUsed: [], friendMap: shuffle(S.students.map(s => s.id))}); S.pick = null; S.lastFriend = null; render(); toast("Números mezclados de nuevo."); break;
      case "tile": revealNumber(+b.dataset.n); break;
      case "award": case "noaward": {
        const p = S.pick; if (!p || p.done) break;
        if (act === "award"){ if (!addToken(p.sid, "pick")) break; }
        p.done = act === "award" ? "ok" : "no";
        if (p.kind === "amigo"){ const s = S.students.find(x => x.id === p.sid); S.lastFriend = s ? splitName(s.name).first : null; }
        render(); if (p.kind === "amigo") setTimeout(() => $("#numIn")?.focus(), 50);
        break;
      }
      case "putback": {
        const p = S.pick; if (!p) break;
        if (p.kind === "ruleta") writeGroup({rouletteUsed: rouletteUsed().filter(x => x !== p.sid)});
        else writeGroup({friendUsed: (G().friendUsed || []).filter(n => n !== p.n)});
        S.pick = null; render(); break;
      }
      case "pp": S.profPeriod = +b.dataset.v; render(); break;
      case "sort": S.profSort = b.dataset.v; render(); break;
      case "plus": addToken(id, "table"); break;
      case "minus": removeToken(id); break;
      case "xlsOne": exportExcel([S.gid]); break;
      case "xlsAll": exportExcel(S.groups.map(g => g.id)); break;
      case "backup": backup(); break;
      case "syncNow": Store.sync.push().then(() => Store.sync.pull()); break;
      case "syncLink": {
        const link = Store.linkFor(location.origin + location.pathname);
        if (location.protocol === "file:"){ toast("Este enlace solo funciona cuando la app está publicada en GitHub Pages.", null, 6000); showLink(link); break; }
        const done = () => toast("Enlace copiado. Guárdalo en una página de Canvas que solo veas tú: lleva la contraseña.", null, 7000);
        try{ navigator.clipboard.writeText(link).then(done, () => showLink(link)); }catch{ showLink(link); }
        break;
      }
      case "dlConfig": Store.download("config.js", Store.configFile(), "text/javascript"); toast("Sube config.js a tu repositorio, sustituyendo el que hay.", null, 6000); break;
      case "logout": confirmBox("¿Cerrar sesión en este ordenador?", "Se guardan en tu hoja los cambios pendientes y se borra la copia de este ordenador. Para volver a entrar necesitarás la contraseña.", "Cerrar sesión", async () => { goHome(); await Store.logout(); S.authView = null; render(); toast("Sesión cerrada."); }); break;
      case "goSetup": S.authView = "setup"; window.scrollTo(0, 0); render(); break;
      case "goLogin": S.authView = "login"; S.loginUrlField = !sess().url; render(); break;
      case "goConnect": S.authView = sess().url ? "login" : "welcome"; render(); break;
      case "lgOtherUrl": S.loginUrlField = true; render(); break;
      case "otherSheet": confirmBox("¿Usar otra hoja?", "Se cerrará la sesión en este ordenador y podrás conectar una hoja distinta.", "Continuar", async () => { goHome(); await Store.logout(); S.authView = "login"; S.loginUrlField = true; render(); }); break;
      case "goOffline": S.authView = null; Store.useOffline(); goHome(); toast("Modo sin conexión: los datos se guardan solo en este navegador."); break;
      case "authBack": if (S.view === "home" && authView() && S.authView){ S.authView = null; render(); } else goHome(); break;
      case "qNext": nextQuestion(); break;
      case "qOk": answerQuestion(true); break;
      case "qBad": answerQuestion(false); break;
      case "qShow": if (S.q){ markUsed(); S.q.phase = "reveal"; S.q.ok = null; render(); } break;
      case "qTemplate": Store.download("plantilla_preguntas.csv", "﻿" + QUESTION_TEMPLATE, "text/csv"); break;
      case "qAdd": {
        const topic = ($("#qaTopic").value || "").trim() || "Sin tema", q = $("#qaQ").value.trim(), a = $("#qaA").value.trim(), exp = $("#qaE").value.trim();
        if (!q || !a){ toast("Escribe la pregunta y la respuesta."); break; }
        const order = S.questions.reduce((m, x) => Math.max(m, x.order), 0) + 1;
        await Store.setItem(S.gid, "questions", Store.newId(), {topic, q, a, exp, order, used: []});
        $("#qaQ").value = ""; $("#qaA").value = ""; $("#qaE").value = ""; document.activeElement?.blur(); toast("Pregunta añadida."); render(); break;
      }
      case "qDel": confirmBox("¿Borrar esta pregunta?", "Se quita del banco. Las fichas ya dadas no cambian.", "Borrar", () => Store.deleteItems(S.gid, "questions", [id]), true); break;
      case "qDelTopic": { const t = b.dataset.t, ids = S.questions.filter(q => q.topic === t).map(q => q.id);
        confirmBox(`¿Borrar el tema «${esc(t)}»?`, `Se borran sus ${ids.length} preguntas. Las fichas ya dadas no cambian.`, "Borrar tema", () => Store.deleteItems(S.gid, "questions", ids), true); break; }
      case "qResetTopic": { const t = b.dataset.t; S.questions.filter(q => q.topic === t && q.used.length).forEach(q => { q.used = []; writeQuestion(q.id, {used: []}); }); toast(`Las preguntas de «${esc(t)}» vuelven a estar disponibles.`); render(); break; }
      case "inst": writeGroup({institution: b.dataset.v}); render(); break;
      case "saveSubject": {
        const name = $("#cName").value.trim() || G().name;
        await writeGroup({name, groupLabel: $("#cGroup").value.trim()}); document.activeElement?.blur(); toast("Guardado."); render(); break;
      }
      case "saveRules": {
        const max = Math.min(50, Math.max(1, Math.round(+$("#cMax").value || 10))), bonus = Math.max(0.01, +String($("#cBonus").value).replace(",", ".") || 1);
        const goalV = Math.round(+$("#cGoal").value) || null, reward = $("#cReward").value.trim();
        await writeGroup({max, bonusMax: bonus, value: bonus / max, goal: goalV, reward}); document.activeElement?.blur(); toast("Reglas guardadas."); render(); break;
      }
      case "applyPreset": {
        const k = $("#cPreset").value, pr = PRESETS[k], cur = lvCfg();
        await writeGroup({preset: k, levels: pr.levels.map((l, i) => ({...l, img: cur[i]?.img || null})), phrase: pr.phrase});
        toast(`Plantilla “${esc(pr.label)}” aplicada.`); document.activeElement?.blur(); render(); break;
      }
      case "saveTitles": {
        const levels = lvCfg().map((lv, i) => ({title: ($("#lvT" + i)?.value || "").trim() || lv.title, desc: ($("#lvD" + i)?.value || "").trim(), img: lv.img || null}));
        await writeGroup({levels, phrase: $("#cPhrase").value.trim() || preset().phrase}); document.activeElement?.blur(); toast("Títulos guardados."); render(); break;
      }
      case "rmImg": { const i = +b.dataset.i, levels = lvCfg().map(x => ({...x})), old = levels[i].img; levels[i].img = null; await writeGroup({levels}); if (old) Store.deleteImage(old); render(); break; }
      case "testMax": case "testMini": { const s = S.students[0] || {name: "Estudiante", trato: null}; celebrate(s, act === "testMax" ? nLv() : 2); break; }
      case "trato": { const s = S.students.find(x => x.id === id); if (!s) break; s.trato = s.trato === "o" ? "a" : s.trato === "a" ? null : "o"; writeStudent(id, {trato: s.trato}); render(); break; }
      case "addStudents":
        modal(`<h3>Subir lista de estudiantes</h3>${listForm("as")}<div class="actions" style="justify-content:flex-end"><button class="btn ghost" data-close>Cancelar</button><button class="btn" id="asOk">Añadir</button></div>`, (m, close) => {
          const get = wireList(m, "as");
          $("#asOk", m).onclick = async () => {
            const existing = new Set(S.students.map(s => s.name.toLocaleLowerCase("es")));
            const names = get().filter(n => !existing.has(n.toLocaleLowerCase("es")));
            $("#asOk", m).disabled = true;
            try{ await createStudents(S.gid, names); close(); toast(`${names.length} estudiantes añadidos.`); }catch{ $("#asOk", m).disabled = false; toast("No se pudieron añadir."); }
          };
        }); break;
      case "delStudent": { const s = S.students.find(x => x.id === id); if (!s) break; confirmBox(`¿Quitar a ${esc(s.name)}?`, "Se borrarán sus fichas de los dos parciales.", "Quitar", () => Store.deleteStudent(S.gid, id), true); break; }
      case "close1": confirmBox("¿Cerrar el 1.er parcial?", "Los marcadores de todo el grupo vuelven a 0 para el 2.º parcial. Las fichas del 1.º quedan guardadas y salen en el Excel.", "Cerrar y empezar el 2.º", async () => { await writeGroup({period: 2, rouletteUsed: [], friendUsed: []}); S.undo = []; render(); toast("Empieza el 2.º parcial. ¡Marcadores a 0!"); }); break;
      case "reopen1": confirmBox("¿Volver al 1.er parcial?", "Las fichas del 2.º se conservan, pero dejarás de sumar en él hasta que lo vuelvas a abrir.", "Volver al 1.er parcial", async () => { await writeGroup({period: 1}); S.undo = []; render(); }); break;
      case "delGroup": confirmBox(`¿Eliminar “${esc(G().name)}”?`, "Se borran la asignatura, sus estudiantes y todas las fichas. No se puede deshacer: descarga antes el Excel o una copia si la necesitas.", "Eliminar definitivamente", async () => { const gid = S.gid; goHome(); await Store.deleteGroup(gid); toast("Asignatura eliminada."); }, true); break;
    }
  });
  document.addEventListener("input", e => {
    if (e.target.id === "search"){ S.query = e.target.value; render(); }
    if (e.target.id === "cMax" || e.target.id === "cBonus"){ const m = +$("#cMax").value || 1, b = +String($("#cBonus").value).replace(",", ".") || 0; $("#cInfo").textContent = `Cada ficha vale ${num(b / m, 3)} pts.`; }
  });
  document.addEventListener("change", e => {
    const t = e.target;
    if (t.id === "compactChk"){ S.compact = t.checked; pref.set("compact", S.compact); render(); }
    if (t.id === "celebrChk"){ S.celebr = t.checked; pref.set("celebr", S.celebr); }
    if (t.id === "restoreFile" && t.files[0]) restore(t.files[0]);
    if (t.id === "qFile" && t.files[0]){ importQuestions(t.files[0]); t.value = ""; }
    if (t.id === "qTopic"){ S.qTopic = t.value; pref.set("qtopic:" + S.gid, S.qTopic); if (S.q && S.q.phase === "reveal") S.q = null; render(); }
    if (t.dataset && t.dataset.lvimg !== undefined && t.files[0]) uploadLevelImg(+t.dataset.lvimg, t.files[0]);
  });
  document.addEventListener("submit", e => {
    if (e.target.id === "loginForm"){
      e.preventDefault();
      const u = ($("#lgUrl")?.value || sess().url || "").trim();
      doLogin(u, $("#lgPass").value, $("#lgRemember").checked);
      return;
    }
    if (e.target.id === "setupForm"){
      e.preventDefault();
      doLogin($("#suUrl").value.trim(), $("#suPass").value, $("#suRemember").checked, {after: afterSetup});
      return;
    }
    if (e.target.id === "numForm"){ e.preventDefault(); const inp = $("#numIn"), n = parseInt(inp.value, 10); inp.value = ""; inp.blur(); revealNumber(n); }
  });
  document.addEventListener("keydown", e => {
    if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "z" && S.view === "subject" && !/INPUT|TEXTAREA/.test(document.activeElement?.tagName)){ e.preventDefault(); undo(); }
    if (e.key === "Escape"){ $("#modalRoot").innerHTML = ""; document.querySelectorAll(".celebrate").forEach(x => x.remove()); }
  });
  // flush deferred render after a spin
  setInterval(() => { if (!S.spinning && S.dirty){ S.dirty = false; render(); } }, 300);

  // ---------- Boot ----------
  renderBar();
  (async () => {
    await Store.init();
    S.ready = true;
    if (Store.mode === "local"){
      Store.sync.onStatus(() => { renderBar(); if (S.view === "home" || S.view === "config"){ const ae = document.activeElement; if (!ae || !/INPUT|TEXTAREA|SELECT/.test(ae.tagName)) render(); } });
      Store.onSession(() => render());
      const tryHash = () => { const h = Store.fromHash(); if (h) doLogin(h.url, h.clave, false); };
      tryHash(); window.addEventListener("hashchange", tryHash);
    }
    let first = true;
    Store.onGroups(list => {
      if (!list){ toast("No se pudieron cargar los datos. Recarga la página."); return; }
      S.groups = list.sort((a, b) => (a.createdAt || 0) - (b.createdAt || 0));
      if (S.gid && !S.groups.some(g => g.id === S.gid)) goHome();
      if (first){ first = false; refreshSummary(); }
      else if (S.view === "home") refreshSummary();
      render();
    });
  })();
})();

</script>
